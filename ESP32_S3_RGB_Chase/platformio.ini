[platformio]
default_envs = host_flash

[env:rgb_chase]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
build_src_filter = +<main.cpp> +<rgb_show.cpp>

; Same flash and USB configuration as the tested USB echo firmware.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.flash_mode = dio
board_build.f_flash = 80000000L

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=0

lib_deps =
    adafruit/Adafruit NeoPixel@1.12.5

upload_protocol = esptool
upload_speed = 115200
monitor_speed = 115200
monitor_echo = no
monitor_eol = LF
monitor_rts = 0
monitor_dtr = 1

; Bind this host project to the identified host while both boards are connected.
upload_port = COM14
monitor_port = COM14

; STEP knob hardware test. Keep the original 20-effect firmware selectable above.
[env:step_encoder]
extends = env:rgb_chase
build_src_filter = +<step_main.cpp> +<step_control.cpp>

; Diagnostic only: H/L hold RGB_IO high/low for multimeter measurements.
; This environment does not generate RGB color data.
[env:rgb_probe]
extends = env:rgb_chase
build_src_filter = +<rgb_probe.cpp>

; Diagnostic only: retransmit low-brightness solid R/G/B frames to all LEDs.
[env:rgb_diagnostic]
extends = env:rgb_chase
build_src_filter = +<rgb_diagnostic.cpp>

; Four encoders: P/I/D/STEP. Original STEP-only and RGB programs remain selectable.
[env:knob_encoder]
extends = env:rgb_chase
build_src_filter = +<knob_main.cpp> +<step_control.cpp>

; Software comparison: persistent checked RMT output; same four-knob decoder.
[env:knob_encoder_rmt]
extends = env:knob_encoder
build_src_filter = +<knob_main.cpp> +<step_control.cpp> +<rgb_rmt.cpp>
build_flags =
    ${env:rgb_chase.build_flags}
    -D PID_RGB_DIRECT_RMT=1
    -D PID_RGB_DATASHEET_TIMING=1

; All 40 LEDs steady white; use the current persistent RMT driver.
[env:rgb_all_on]
extends = env:rgb_chase
build_src_filter = +<rgb_all_on.cpp> +<rgb_rmt.cpp>
lib_deps =
build_flags =
    ${env:rgb_chase.build_flags}
    -D PID_RGB_DATASHEET_TIMING=1

; OLED-only test. Keep the verified knob program selectable above.
[env:oled_ok]
extends = env:rgb_chase
build_src_filter = +<oled_ok.cpp>
lib_deps = olikraus/U8g2@2.36.18

[env:oled_ok_sh1106]
extends = env:oled_ok
build_flags =
    ${env:rgb_chase.build_flags}
    -D OLED_USE_SH1106=1

; Integrated local PID panel: idle breathing RGB, one shared comet, four OLED values.
[env:host_panel]
extends = env:knob_encoder_rmt
build_src_filter = +<knob_main.cpp> +<step_control.cpp> +<rgb_rmt.cpp> +<host_ui.cpp> +<host_oled.cpp>
lib_deps = olikraus/U8g2@2.36.18
build_flags =
    ${env:knob_encoder_rmt.build_flags}
    -D PID_HOST_UI=1
    -D PID_RGB_TEMPORAL_DITHER=1

; Local/USB product functions; radio stays off. Keep host_panel as the accepted effect baseline.
[env:host_local]
extends = env:host_panel
build_src_filter = ${env:host_panel.build_src_filter} +<host_local_core.cpp> +<host_local_app.cpp>
build_flags =
    ${env:host_panel.build_flags}
    -D PID_HOST_LOCAL=1

[env:host_wireless]
extends = env:host_local
lib_extra_dirs = ../PID_Shared
upload_port = COM14
monitor_port = COM14
build_flags =
    ${env:host_local.build_flags}
    -D PID_LINK_ENABLED=1

; Opt-in wireless STM32 image transfer; existing accepted default remains selectable.
[env:host_flash]
extends = env:host_wireless
build_flags =
    ${env:host_wireless.build_flags}
    -D PID_FLASH_ENABLED=1

[env:host_flash_loss_test]
extends = env:host_flash
build_flags =
    ${env:host_flash.build_flags}
    -D PID_FLASH_TEST_DROP_EVERY=5
