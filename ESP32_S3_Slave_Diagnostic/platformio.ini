[platformio]
default_envs = slave_flash_psram

[env:slave_diagnostic]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.flash_mode = dio
board_build.f_flash = 80000000L
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=0
upload_protocol = custom
extra_scripts = post:tools/upload_hook.py
custom_usb_serial = 44:1b:f6:8d:10:18
upload_speed = 115200
monitor_speed = 115200
monitor_echo = no
monitor_eol = LF
monitor_rts = 0
monitor_dtr = 1
monitor_port = COM18
; Upload follows custom_usb_serial, including Windows COM renumbering.
; monitor_port is only the serial monitor's saved selection.
; This diagnostic deliberately does not initialize PSRAM or wireless.

[env:slave_wireless]
extends = env:slave_diagnostic
lib_extra_dirs = ../PID_Shared
build_flags =
    ${env:slave_diagnostic.build_flags}
    -D PID_LINK_ENABLED=1

; Staging-only transport validation; cannot drive the target even with !fw flash.
[env:slave_flash_transport]
extends = env:slave_wireless
build_flags =
    ${env:slave_wireless.build_flags}
    -D PID_FLASH_ENABLED=1
    -D PID_FLASH_TARGET_ENABLE=0

; Actual STM32F103C8/G431 UART programmer. Only an explicit ERASE command enables target I/O.
[env:slave_flash]
extends = env:slave_wireless
build_flags =
    ${env:slave_wireless.build_flags}
    -D PID_FLASH_ENABLED=1
    -D PID_FLASH_TARGET_ENABLE=1
    ; 2 us half period: <=250 kHz after GPIO/software overhead. Full verification stays enabled.
    ; Set to 5 for the previously accepted, slower SWD clock if long wiring needs it.
    -D PID_FLASH_SWD_HALF_PERIOD_US=2

[env:slave_flash_loss_test]
extends = env:slave_flash_transport
build_flags =
    ${env:slave_flash_transport.build_flags}
    -D PID_FLASH_TEST_DROP_EVERY=5

; N16R8 only: enable 8 MB Octal PSRAM for F407 images above 128 KiB.
; DIO flash configuration stays the same as the accepted slave_flash image.
[env:slave_flash_psram]
extends = env:slave_flash
board_build.arduino.memory_type = dio_opi
board_build.psram_type = opi
build_flags =
    ${env:slave_flash.build_flags}
    -D BOARD_HAS_PSRAM
